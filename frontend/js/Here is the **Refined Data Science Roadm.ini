Here is the **Refined Data Science Roadmap** for the ExpenseAI project. This plan transforms your application from a "Wrapper Wrapper" (just calling APIs) into a **Production-Grade ML System** that uses a Hybrid Architecture (Teacher-Student models).

This roadmap optimizes for **Cost, Latency, and Privacy**.

### **The "Smart" Data Science Roadmap**

#### **Phase 0: Infrastructure & Security (The Foundation)**

* **Goal:** Secure the app and prepare the database for multi-user data isolation.
* **Tech Stack:** Flask-Login, SQLAlchemy Relationships (User <-> Expenses), Hashing (bcrypt).
* **Why:** You cannot train personalized models (Phase 3 & 4) if you don't know *who* the data belongs to.
* **Deliverable:** A secure Login/Register system where User A cannot see User B's expenses.

#### **Phase 1: The "Data Factory" (Bootstrap with Llama)**

* **Goal:** Use Llama 3.1 (The "Teacher") to handle intents *while* silently building a labeled dataset.
* **Refinement:** Instead of just "Intent Detection," we add a **Logger**.
* **Action:** Every time Llama successfully extracts `{"intent": "ADD", "amount": 500, "category": "Food"}`, we save the *User's Sentence* and the *JSON Output* to a `training_dataset` table.


* **Why:** You solve the "Cold Start" problem. You get thousands of perfectly labeled examples for free without manual tagging.
* **Deliverable:** A working chatbot that is secretly a data labeling machine.

#### **Phase 2: The "Student" Model (Model Distillation)**

* **Goal:** Replace Llama 3.1 with a free, fast, local model for 90% of queries.
* **Refinement:** Train a custom **spaCy** or **DistilBERT** model using the data collected in Phase 1.
* **Architecture:**
* **The Router:** A lightweight classifier decides: "Is this complex?"
* **Simple Path (90%):** "Lunch 500" -> Sent to Local Model (5ms latency, ₹0 cost).
* **Complex Path (10%):** "I think I'm spending too much on weekends, analyze it" -> Sent to Llama 3.1.


* **Why:** Drastically reduces Groq/OpenAI token costs and API dependency.
* **Deliverable:** A `custom_ner_model.pkl` file running locally in your Python backend.

#### **Phase 3: Anomaly Detection (Statistical & ML)**

* **Goal:** Catch spending outliers.
* **Refinement:**
* **Step 1 (Statistical):** Z-Score (Standard Deviation). "This expense is 3x your average."
* **Step 2 (ML - New):** **Isolation Forest**. This algorithm detects "weird" patterns that aren't just high amounts (e.g., spending on "Office Cab" at 3 AM on a Sunday).


* **Why:** Adds "Intelligence" beyond just logging data.
* **Deliverable:** Real-time alerts: *"Unusual spending detected: ₹5000 on 'Gaming' (User usually spends ₹0)."*

#### **Phase 4: The Recommendation Engine (Personalization)**

* **Goal:** Suggest actionable savings.
* **Refinement:**
* **Rule-Based:** "You spent 40% on Food; recommend reducing to 30%."
* **ML-Based (New):** **Clustering (K-Means)**. Group users into profiles (e.g., "The Foodie", "The Commuter").
* **Action:** "Users like you usually save ₹2000/month by switching to a monthly metro pass."


* **Why:** Transforms the app from a "Tracker" to an "Advisor."
* **Deliverable:** A "Monthly Insights" dashboard widget.

#### **Phase 5: Perception AI (Voice & Vision)**

* **Goal:** Frictionless data entry.
* **Refinement:**
* **Voice:** Integration of **OpenAI Whisper (Base model)** running locally or via API for Indian accent support.
* **Vision (New Phase Suggestion):** **Receipt OCR (LayoutLM)**. Take a picture of a bill, and the AI extracts the total and merchant automatically.


* **Why:** Convenience is the #1 feature for mobile users.
* **Deliverable:** Microphone and Camera buttons in the chat interface.

#### **Phase 6: Forecasting (Time Series)**

* **Goal:** Predict next month's balance.
* **Refinement:** Use **Prophet** or **ARIMA** models to forecast future spending based on past history.
* **Why:** "Will I go broke by the 25th?" is the most important question for users.
* **Deliverable:** A graph showing "Projected vs. Actual" spending.

